id: login_smoke
name: Login smoke (the-internet)
base_url: https://the-internet.herokuapp.com/login
tags:
  - enriched
  - the-internet
  - login
steps:
  - action: navigate
    url: https://the-internet.herokuapp.com/login
  - action: assert
    target: page
    text: Login Page
  - action: fill
    target: username
    name: username
    id: username
    value: tomsmith
  - action: fill
    target: password
    name: password
    id: password
    value: SuperSecretPassword!
  - action: click
    target: login
    text: Login
    role: button
  - action: navigate
    url: https://the-internet.herokuapp.com/
  - action: click
    target: form_auth_link
    text: Form Authentication
    role: link
