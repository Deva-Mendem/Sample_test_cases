id: TC009_forgot_password
name: Forgot password form
base_url: https://the-internet.herokuapp.com/forgot_password
steps:
  - action: navigate
    url: https://the-internet.herokuapp.com/forgot_password
  - action: assert
    target: heading
    text: Forgot Password
  - action: fill
    target: email
    name: email
    id: email
    value: demo@example.com
  - action: click
    target: retrieve
    text: Retrieve password
    role: button
  - action: navigate
    url: https://the-internet.herokuapp.com/
  - action: click
    target: forgot_link
    text: Forgot Password
    role: link
